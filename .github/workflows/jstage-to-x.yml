name: jstage-to-x

on:
  schedule:
    - cron: "53 1 * * *"   #（UTC）
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        options: [post, dry-run, init]
        default: post

permissions:
  contents: write

concurrency: jstage-to-x

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          case "${{ github.event.inputs.mode || 'post' }}" in
            init)    python bot.py --init ;;
            dry-run) python bot.py --dry-run ;;
            *)       python bot.py ;;
          esac

      - name: commit posted.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update posted.json"
            git push
          fi
